<!DOCTYPE html>
<html>
<head>
    <title>{{ Configs.ctf_name }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ Configs.ctf_small_icon }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('views.themes', path='css/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('views.themes', path='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('views.themes', path='css/core.css') }}">
    {% block stylesheets %}
    {% endblock %}

    <!-- CSS for the yellow and black theme -->
    <style>
    /* CSS Variables for a yellow and black theme */
    :root {
      --page-bg-color: #000000; /* Black background for the page */
      --navbar-bg-color: #000000;
      --main-text-color: #ffffff; /* White text for contrast */
      --accent-color: #ffde00; /* Yellow for accents and links */
      --navbar-box-shadow: 0 2px 4px rgba(255, 255, 255, 0.1);
    }

    /* Apply the black background and light text to the entire page body */
    body {
        background-color: var(--page-bg-color);
        color: var(--main-text-color);
    }
    
    /* Make all text within the main content area and containers light */
    .text-dark {
        color: var(--main-text-color) !important;
    }
    .text-muted {
        color: #ddd !important;
    }

    /*
      New styles to fix the visibility issues on the Teams/Users pages.
      This targets the table elements, form inputs, and pagination links.
    */
    .table-striped, .table {
        color: var(--main-text-color);
    }

    .table-striped tbody tr:nth-of-type(odd) {
        background-color: rgba(255, 255, 255, 0.05);
    }

    .table thead td b {
        color: var(--main-text-color);
    }

    .table a {
        color: var(--accent-color);
    }

    .form-control {
        background-color: #222;
        color: #fff;
        border: 1px solid #444;
    }

    .btn-primary {
        background-color: var(--accent-color);
        border-color: var(--accent-color);
        color: #000;
    }
    .btn-primary:hover {
        background-color: #e5c300;
        border-color: #e5c300;
    }

    .page-select {
        background-color: #222;
        color: #fff;
        border: 1px solid #444;
    }

    /* Custom styles for the navbar */
    .custom-navbar {
      background-color: var(--navbar-bg-color);
      box-shadow: var(--navbar-box-shadow);
    }

    .custom-navbar .nav-link {
      color: var(--main-text-color);
    }

    .custom-navbar .nav-link:hover,
    .custom-navbar .nav-link.active {
      color: var(--accent-color);
    }

    .custom-navbar .navbar-brand {
      color: var(--accent-color);
      font-weight: 700;
    }
    </style>

    {{ Plugins.styles }}
    <script type="text/javascript">
        var init = {
            'urlRoot': "{{ request.script_root }}",
            'csrfNonce': "{{ Session.nonce }}",
            'userMode': "{{ Configs.user_mode }}",
            'userId': {{ Session.id | tojson }},
            'userName': {{ User.name | tojson }},
            'userEmail': {{ User.email | tojson }},
            'teamId': {{ Team.id | tojson }}, 
            'teamName': {{ Team.name | tojson }},
            'start': {{ Configs.start | tojson }},
            'end': {{ Configs.end | tojson }},
            'theme_settings': {{ Configs.theme_settings | tojson }}
        }
    </script>
    {{ Configs.theme_header }}
</head>
<body>
    <!-- 
        To apply the custom navbar styles, you must add the
        `class="custom-navbar"` to the `<nav>` tag inside 
        `components/navbar.html`.
    -->
    {% include "components/navbar.html" %}

    <main role="main">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <div class="container text-center">
            <a href="https://ctfd.io" class="text-secondary">
                <small class="text-muted">Powered by CTFd</small>
            </a>
        </div>
    </footer>

    <script src="{{ url_for('views.themes', path='js/vendor.bundle.js') }}"></script>
    <script src="{{ url_for('views.themes', path='js/core.js') }}"></script>
    <script src="{{ url_for('views.themes', path='js/helpers.js') }}"></script>

    {% block entrypoint %}
    <script src="{{ url_for('views.themes', path='js/pages/main.js') }}"></script>
    {% endblock %}

    {% block scripts %}
    {% endblock %}

    {{ Plugins.scripts }}

    {{ Configs.theme_footer }}
</body>
</html>
